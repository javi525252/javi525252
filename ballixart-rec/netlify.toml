[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "display-capture=(self), camera=(self), microphone=(self), screen-wake-lock=(self), picture-in-picture=(self), clipboard-write=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/descargas/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=ballixart-rec.apk"

# El código fuente de la app Android (y su clave de firma) no se publica.
[[redirects]]
  from = "/android/*"
  to = "/404.html"
  status = 404
  force = true
