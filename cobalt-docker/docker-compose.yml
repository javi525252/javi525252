# Cobalt (imputnet/cobalt) listo para Docker.
# Uso:  docker compose up -d     ->  API en http://localhost:9000
services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: cobalt
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      # Solo tu equipo. Si lo publicas con un proxy inverso, deja 127.0.0.1.
      - 127.0.0.1:9000:9000
    environment:
      # Cambia por la URL pública de tu instancia (si no, el "tunneling" falla).
      API_URL: "${API_URL:-http://localhost:9000/}"
      # Si usas cookies (opcional), descomenta esta línea y el volumen de abajo:
      # COOKIE_PATH: "/cookies.json"
    # volumes:
    #   - ./cookies.json:/cookies.json
    labels:
      - com.centurylinklabs.watchtower.scope=cobalt

  # Actualiza cobalt automáticamente (cada 15 min). Quítalo si no lo quieres.
  watchtower:
    image: ghcr.io/containrrr/watchtower
    restart: unless-stopped
    command: --cleanup --scope cobalt --interval 900 --include-restarting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
